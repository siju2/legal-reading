5" width="1620" height="102" rx="9" fill="#FBF5E8" stroke="#E9D8B5"/><text x="58" y="1074" font-size="16" fill="#193F3D" font-weight="700" text-anchor="start">구성도 읽는 법</text><text x="58" y="1101" font-size="13" fill="#607674" font-weight="400" text-anchor="start">* 법제처·AI·결제는 인증값과 서비스 설정에 따라 활성화됩니다. AI 설명은 로그인·동의 후 공개 실제 판례에서 사용합니다.</text><text x="58" y="1126" font-size="13" fill="#607674" font-weight="400" text-anchor="start">상담·백업·PDF는 노트의 하위 기능입니다. 관리자도 다른 회원의 개인 노트를 열람할 수 없습니다. 웹훅·내부 API는 메뉴에서 제외했습니다.</text><text x="40" y="1186" font-size="12" fill="#607674" font-weight="400" text-anchor="start">판결읽기 | 2026-11-04 | 현재 구현 기준 · 계정 비밀번호 및 실제 키 제외</text></svg>