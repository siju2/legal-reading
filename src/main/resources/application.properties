spring.application.name=legal-reading
spring.datasource.url=jdbc:mysql://localhost:3306/project?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:project_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.encoding=UTF-8
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB



# External integrations are opt-in; secrets stay in environment/data, never in templates.
legal.ai.enabled=${LEGAL_AI_ENABLED:false}
legal.ai.api-key=${OPENAI_API_KEY:}
legal.ai.model=${LEGAL_AI_MODEL:gpt-5-mini}
legal.ai.daily-limit=${LEGAL_AI_DAILY_LIMIT:10}
legal.billing.enabled=${LEGAL_BILLING_ENABLED:false}
legal.billing.enforce-premium=${LEGAL_BILLING_ENFORCE_PREMIUM:false}
legal.billing.api-secret=${PORTONE_API_SECRET:}
legal.billing.webhook-secret=${PORTONE_WEBHOOK_SECRET:}
legal.billing.store-id=${PORTONE_STORE_ID:}
legal.billing.channel-key=${PORTONE_CHANNEL_KEY:}
legal.billing.price=${LEGAL_BILLING_PRICE:9900}
legal.billing.pass-days=${LEGAL_BILLING_PASS_DAYS:30}

spring.config.import=optional:classpath:application-local.properties,optional:file:./data/integrations.properties
