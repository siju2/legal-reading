<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 | 판결읽기</title><link rel="stylesheet" th:href="@{/css/legal.css}"></head>
<body><main class="auth-shell"><span class="brand">판결읽기</span><h1>다시 만나 반가워요</h1><p class="subtitle">로그인하고 시작하세요.</p>
<p class="error notice" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
<p class="success notice" th:if="${param.registered}">회원가입이 완료되었습니다. 로그인해 주세요.</p>
<p class="success notice" th:if="${param.logout}">로그아웃되었습니다.</p>
<form data-login-preferences th:action="@{/login}" method="post"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required autofocus maxlength="30">
<label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<div class="auth-options">
<label class="auth-option"><input type="checkbox" name="save-username" id="save-username"> 아이디 저장</label>
<label class="auth-option"><input type="checkbox" name="remember-me" id="remember-me"> 자동 로그인 (14일)</label>
</div><p class="footer">공용 기기에서는 선택하지 마세요. 로그아웃하면 자동 로그인이 해제됩니다.</p>
<button type="submit">로그인</button></form>
<p class="footer">아직 계정이 없나요? <a th:href="@{/signup}">회원가입</a></p><p class="footer"><a href="/">← 판결읽기 홈으로</a></p></main><script defer th:src="@{/js/login-preferences.js}"></script></body></html>
