<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{legal/layout::head('법률 용어 사전')}"></head><body><header th:replace="~{legal/layout::header}"></header><main class="narrow"><div class="page-heading"><div class="eyebrow">읽다가 막히는 단어를 쉽게</div><h1>법률 용어 사전</h1><p>정의와 예시를 함께 읽어보세요.</p></div><form action="/glossary" class="search"><label class="sr-only" for="term">용어 검색</label><input id="term" name="q" maxlength="80" th:value="${q}" placeholder="입증책임, 파기환송, 통상임금…"><button>찾기</button></form><p class="empty" th:if="${terms.empty}">일치하는 용어가 없습니다. 더 짧은 단어로 검색해 보세요.</p><article class="term" th:each="t:${terms}"><h2 th:text="${t.name}"></h2><p th:text="${t.explanation}"></p><p class="example" th:text="${t.example}"></p></article><p class="muted">이 사전은 학습을 위한 간단한 설명입니다. 정확한 적용은 관련 조문·판결 원문을 함께 확인하세요.</p></main><footer th:replace="~{legal/layout::footer}"></footer></body></html>
