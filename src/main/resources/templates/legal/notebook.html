<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{legal/layout::head(${book.title})}"></head><body><header th:replace="~{legal/layout::header}"></header><main><p class="breadcrumb"><a href="/notebooks">나의 사건 노트</a> / 비공개</p><div class="page-heading"><span class="badge" th:text="${book.category}"></span><h1 th:text="${book.title}"></h1><p>확인된 사실을 시간순으로 기록하세요. 판단·추측과 사실은 구분해 적는 것이 좋습니다.</p></div><p class="notice" th:if="${notice}" th:text="${notice}"></p><div class="notebook-grid"><section><h2>사건 타임라인</h2><p class="empty" th:if="${events.empty}">아래 양식에서 첫 기록을 남겨보세요.</p><ol class="timeline"><li th:each="e:${events}"><time th:text="${e.occurredOn}"></time><span class="badge" th:text="${e.kind}"></span><h3 th:text="${e.title}"></h3><p class="pre" th:text="${e.note}"></p><form th:action="@{/notebooks/{id}/events/{eventId}/delete(id=${book.id},eventId=${e.id})}" method="post"><button class="text-button danger">이 기록 삭제</button></form></li></ol><details class="entry-form" open><summary>날짜별 기록 추가</summary><form class="editor" th:action="@{/notebooks/{id}/events(id=${book.id})}" method="post"><div class="field-grid"><div><label for="date">발생일</label><input id="date" name="date" type="date" th:max="${today}" required></div><div><label for="kind">유형</label><select id="kind" name="kind"><option th:each="k:${kinds}" th:text="${k}" th:value="${k}"></option></select></div></div><label for="eventTitle">어떤 일이 있었나요?</label><input id="eventTitle" name="title" maxlength="120" required><label for="eventNote">확인한 내용 (선택)</label><textarea id="eventNote" name="note" maxlength="2000" rows="4" placeholder="상대방은 A처럼 표시하고, 불필요한 개인정보는 적지 마세요."></textarea><button>기록 저장</button></form></details></section><aside class="side-panel"><h2>준비 자료 체크리스트</h2><p><strong th:text="${completed}"></strong> / <span th:text="${checks.size()}"></span> 항목 확인</p><progress th:value="${completed}" th:max="${checks.empty?1:checks.size()}" aria-label="준비 자료 진행률"></progress><form class="check-item" th:each="c:${checks}" th:action="@{/notebooks/{id}/checks/{itemId}(id=${book.id},itemId=${c.id})}" method="post"><label><input type="checkbox" name="completed" value="true" th:checked="${c.completed}"><span th:text="${c.label}"></span></label><button class="text-button">상태 저장</button></form><p class="muted">자료 정리용 참고 목록입니다. 제출 요건·법률상 기한·권리 성립을 판정하는 기능은 아닙니다.</p><a th:if="${book.sourceCaseId!=null}" th:href="@{/cases/{id}(id=${book.sourceCaseId})}">참고 사례 보기 →</a></aside></div><details class="delete-panel"><summary>노트 삭제</summary><p>이 노트의 타임라인과 체크리스트도 함께 삭제됩니다.</p><form th:action="@{/notebooks/{id}/delete(id=${book.id})}" method="post"><button class="secondary danger">노트와 기록 삭제</button></form></details></main><footer th:replace="~{legal/layout::footer}"></footer></body></html>
