<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{legal/layout::head('프로젝트 대시보드')}"></head><body><header th:replace="~{legal/layout::header}"></header><main><div class="page-heading"><div class="eyebrow">프로젝트 현황 · 관리자 전용</div><h1>프로젝트 대시보드</h1><p>판례 자료와 로컬 AI 연결 상태를 한눈에 확인합니다.</p><a class="button" href="/admin/cases/new">새 자료 등록</a></div><section class="dashboard-grid" aria-label="프로젝트 자료 현황"><article class="dashboard-card"><span>실제 판결 자료</span><strong th:text="${realCount}">0</strong><small>실제 사건 자료</small></article><article class="dashboard-card"><span>학습용 사례</span><strong th:text="${demoCount}">0</strong><small>가상 사례로 표시</small></article><article class="dashboard-card"><span>공개 자료</span><strong th:text="${publishedCount}">0</strong><small>이용자에게 표시</small></article><article class="dashboard-card"><span>비공개 초안</span><strong th:text="${draftCount}">0</strong><small>관리자만 확인</small></article></section><section class="dashboard-status"><div><div class="eyebrow">로컬 AI</div><h2 th:text="${!aiConfigured?'설정되지 않음':(aiRunning?'실행 중':'연결 대기 중')}">연결 대기 중</h2><p th:text="${!aiConfigured?'AI 기능이 꺼져 있거나 연결 설정이 없습니다.':(aiLocal?'이 PC의 로컬 모델을 사용합니다.':'외부 AI 설정이 활성화되어 있습니다.')}">이 PC의 로컬 모델 상태입니다.</p></div><span class="status-pill" th:classappend="${aiRunning}?'status-online':'status-offline'" th:text="${aiRunning?'연결됨':'미연결'}">미연결</span></section><div class="section-heading"><div><div class="eyebrow">최근 변경 순</div><h2>자료 관리</h2></div><a href="/cases">이용자 화면 보기 →</a></div><p class="notice" th:if="${notice}" th:text="${notice}"></p><div class="table-scroll"><table><thead><tr><th>자료</th><th>유형</th><th>상태</th><th>출처 확인일</th><th>관리</th></tr></thead><tbody><tr th:each="c:${entries}"><td th:text="${c.title}"></td><td th:text="${c.demo}?'가상 사례':'실제 판결'"></td><td th:text="${c.published}?'공개':'비공개 초안'"></td><td th:text="${c.sourceCheckedAt}"></td><td><a th:href="@{/admin/cases/{id}/edit(id=${c.id})}">편집·이력</a> · <a th:href="@{/cases/{id}(id=${c.id})}">미리보기</a></td></tr><tr th:if="${entries.empty}"><td colspan="5">아직 등록된 자료가 없습니다.</td></tr></tbody></table></div></main><footer th:replace="~{legal/layout::footer}"></footer></body></html>
