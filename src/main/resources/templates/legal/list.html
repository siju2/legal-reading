<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{legal/layout::head('판결 아카이브')}"></head><body><header th:replace="~{legal/layout::header}"></header><main><div class="page-heading"><div class="eyebrow">상황으로 탐색하는 자료실</div><h1>판결 아카이브</h1><p>비슷한 쟁점과 사실을 찾고, 공식 원문을 함께 읽어보세요.</p></div><form action="/cases" method="get" class="filter"><label>상황·사건번호<input name="q" th:value="${q}" maxlength="160" placeholder="월급, 보증금, 대여금…"></label><label>생활 분야<select name="category"><option value="">모든 분야</option><option th:each="cat:${categories}" th:value="${cat}" th:text="${cat}" th:selected="${category==cat}"></option></select></label><label>자료 유형<select name="type"><option value="all" th:selected="${type=='all'}">전체 자료</option><option value="real" th:selected="${type=='real'}">실제 판결</option><option value="demo" th:selected="${type=='demo'}">가상 학습 사례</option></select></label><button>검색</button></form><p class="muted"><strong th:text="${results.totalElements}"></strong>개의 자료 · 키워드와 생활용어 확장 검색을 사용합니다.</p><div th:if="${results.empty}" class="empty"><h2>일치하는 자료가 없어요.</h2><p>더 짧은 단어나 다른 분야로 검색해 보세요. 현재 자료실에 모든 판결이 수록된 것은 아닙니다.</p><a href="/cases">전체 자료 보기</a></div><div class="card-grid"><th:block th:each="c:${results.content}"><article th:replace="~{legal/layout::card(${c})}"></article></th:block></div><nav class="pagination" th:if="${results.totalPages>1}"><a th:if="${results.hasPrevious()}" th:href="@{/cases(q=${q},category=${category},type=${type},page=${results.number-1})}">← 이전</a><span th:text="${results.number+1}+' / '+${results.totalPages}"></span><a th:if="${results.hasNext()}" th:href="@{/cases(q=${q},category=${category},type=${type},page=${results.number+1})}">다음 →</a></nav></main><footer th:replace="~{legal/layout::footer}"></footer></body></html>
