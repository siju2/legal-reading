<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title}+' | 판결읽기'">판결읽기</title><link rel="stylesheet" th:href="@{/css/legal.css}"></head><body>
<header th:fragment="header" class="site-header"><div class="top"><a class="brand" href="/">판결읽기<span>생활법률 아카이브</span></a><div class="account"><th:block th:if="${viewer==null}"><a href="/login">로그인</a><a href="/signup">회원가입</a></th:block><th:block th:if="${viewer!=null}"><a href="/my" th:text="${viewer}+'님의 보관함'"></a><form th:action="@{/logout}" method="post"><button class="text-button">로그아웃</button></form></th:block></div></div><nav aria-label="주 메뉴"><a href="/situation">상황별 질문</a><a href="/cases">판결 아카이브</a><a href="/compare">사례 비교</a><a href="/glossary">법률 용어 사전</a><a href="/law-search">공식 법률 검색</a><a href="/notebooks">나의 사건 노트</a><a href="/guide">이용·출처 안내</a><a th:if="${isAdmin}" href="/admin">자료 관리</a></nav></header>
<footer th:fragment="footer" class="site-footer"><strong>판결읽기</strong><p>공개 판결을 생활의 언어로 이해합니다. 해설과 원문을 함께 확인하세요.</p><p>일반적인 학습 정보이며 개별 사건의 결론을 예측하지 않습니다. 법령 적용 시점과 사실관계에 따라 판단은 달라질 수 있습니다.</p><a href="/guide">자료 기준·정정 안내</a></footer>
<article th:fragment="card(c)" class="case-card"><div class="card-meta"><span class="badge" th:text="${c.category}"></span><span class="badge" th:classappend="${c.demo}?'demo':'real'" th:text="${c.demo}?'가상 학습 사례':'실제 판결'">실제 판결</span></div><h3><a th:href="@{/cases/{id}(id=${c.id})}" th:text="${c.title}"></a></h3><p th:text="${c.summary}"></p><div class="case-info" th:if="${!c.demo}"><span th:text="${c.court}"></span> · <span th:text="${c.decisionDate}"></span><br><span th:text="${c.caseNumber}"></span></div><div class="case-info" th:if="${c.demo}">실제 사건번호·판결 결과가 없는 학습 자료</div><a class="read-link" th:href="@{/cases/{id}(id=${c.id})}">내용 읽기 →</a></article>
<div th:fragment="explained(value)" class="explained pre"><th:block th:each="part:${@termExplainer.split(value)}"><span th:if="${part.explanation==null}" th:text="${part.text}"></span><details th:if="${part.explanation!=null}" class="inline-term"><summary th:text="${part.text}"></summary><span class="term-popover"><strong th:text="${part.text}"></strong><span th:text="${part.explanation}"></span><a th:href="@{/glossary(q=${part.text})}">용어 사전에서 보기 →</a></span></details></th:block></div></body></html>
