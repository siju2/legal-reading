<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{legal/layout::head('AI 판례 설명')}"></head><body><header th:replace="~{legal/layout::header}"></header><main>
<p class="breadcrumb"><a th:href="@{/cases/{id}(id=${caseId})}">판례로 돌아가기</a></p>
<div class="page-heading"><span class="badge">AI 생성 설명</span><h1 th:text="${explanation.title}"></h1><p th:text="${explanation.mode}"></p></div>

<article class="side-panel"><p class="pre" th:text="${explanation.answer}"></p></article>
<p><a class="button secondary" th:href="${explanation.sourceUrl}" target="_blank" rel="noopener noreferrer">공식 원문 확인</a></p>
</main><footer th:replace="~{legal/layout::footer}"></footer></body></html>
