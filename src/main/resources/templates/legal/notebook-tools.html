<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="pdfOptions(action,consultation)" class="pdf-options"><details><summary>PDF에 포함할 내용 선택</summary>
<form class="editor" th:action="${action}" method="get"><input type="hidden" name="sections" value="_selection"><fieldset><legend>포함할 항목</legend>
<label th:if="${consultation}" class="check"><input type="checkbox" name="sections" value="summary" checked>사건 요약</label><label th:if="${consultation}" class="check"><input type="checkbox" name="sections" value="goal" checked>상담 목표</label><label th:if="${consultation}" class="check"><input type="checkbox" name="sections" value="questions" checked>상담 질문</label>
<label class="check"><input type="checkbox" name="sections" value="timeline" checked>날짜별 기록</label><label class="check"><input type="checkbox" name="sections" value="checklist" checked>준비 자료</label><label th:if="${consultation}" class="check"><input type="checkbox" name="sections" value="source" checked>참고 자료</label><label class="check"><input type="checkbox" name="sections" value="followups">상담 후 기록·다음 할 일</label></fieldset>
<label for="pdf-notes">상세 메모</label><select id="pdf-notes" name="notes"><option value="false">날짜별 메모·상담 답변 제외</option><option value="true">날짜별 메모·상담 답변 포함</option></select><small>요약·질문·다음 할 일은 해당 항목을 선택하면 포함됩니다.</small><button>선택한 내용으로 PDF 받기</button></form></details></section>
<section th:fragment="followups" class="side-panel" id="followups"><h2>상담 후 기록</h2><p>상담에서 확인한 답변과 다음 할 일을 정리하세요.</p><p th:if="${followups.empty}">아직 상담 후 기록이 없습니다.</p>
<article class="followup-card" th:each="log:${followups}"><time th:text="${log.consultedOn}"></time> <span class="badge" th:text="${log.completed?'후속 조치 완료':'후속 조치 진행 중'}"></span><h3>상담 답변</h3><p class="pre" th:text="${log.answer}"></p><h3>다음 할 일</h3><p class="pre" th:text="${log.nextActions}"></p>
<details><summary>기록 수정</summary><form class="editor" th:id="'followup-'+${log.id}" data-draft th:data-draft-owner="${viewer}" th:data-draft-saved="${draftSaved}" th:action="@{/notebooks/{id}/followups/{logId}/edit(id=${book.id},logId=${log.id})}" method="post"><label th:for="'log-date-'+${log.id}">상담 날짜</label><input th:id="'log-date-'+${log.id}" name="date" type="date" th:value="${log.consultedOn}" th:max="${today}" required><label th:for="'log-answer-'+${log.id}">상담 답변</label><textarea th:id="'log-answer-'+${log.id}" name="answer" maxlength="4000" rows="5" th:text="${log.answer}" required></textarea><label th:for="'log-next-'+${log.id}">다음 할 일</label><textarea th:id="'log-next-'+${log.id}" name="nextActions" maxlength="2000" rows="3" th:text="${log.nextActions}"></textarea><label class="check"><input type="checkbox" name="completed" value="true" th:checked="${log.completed}">후속 조치 완료</label><button>수정 저장</button></form></details>
<form th:action="@{/notebooks/{id}/followups/{logId}/delete(id=${book.id},logId=${log.id})}" method="post"><button class="text-button danger">이 상담 후 기록 삭제</button></form></article>
<details><summary>상담 후 기록 추가</summary><form id="followup" data-draft th:data-draft-owner="${viewer}" th:data-draft-saved="${draftSaved}" class="editor" th:action="@{/notebooks/{id}/followups(id=${book.id})}" method="post"><label for="followup-date">상담 날짜</label><input id="followup-date" name="date" type="date" th:max="${today}" required><label for="followup-answer">상담 답변 (4,000자 이내)</label><textarea id="followup-answer" name="answer" maxlength="4000" rows="5" required></textarea><label for="followup-next">다음 할 일 (2,000자 이내)</label><textarea id="followup-next" name="nextActions" maxlength="2000" rows="3"></textarea><button>상담 후 기록 저장</button></form></details></section>
<div th:fragment="checkEditor(item)" class="check-editor"><details><summary>이름 수정·항목 삭제</summary><form class="editor" th:action="@{/notebooks/{id}/checks/{itemId}/edit(id=${book.id},itemId=${item.id})}" method="post"><label th:for="'check-label-'+${item.id}">준비 자료 이름</label><input th:id="'check-label-'+${item.id}" name="label" maxlength="250" th:value="${item.label}" required><button class="secondary">이름 저장</button></form><form th:action="@{/notebooks/{id}/checks/{itemId}/delete(id=${book.id},itemId=${item.id})}" method="post"><button class="text-button danger">이 항목 삭제</button></form></details></div>
</body></html>
