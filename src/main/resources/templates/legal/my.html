<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{legal/layout::head('내 보관함')}"></head><body><header th:replace="~{legal/layout::header}"></header><main class="narrow"><div class="page-heading"><div class="eyebrow">나의 법률 공부 기록</div><h1>내 보관함</h1><p>저장한 자료와 메모는 본인에게만 표시됩니다.</p><a class="button secondary" href="/notebooks">나의 사건 타임라인·체크리스트 →</a></div><p class="notice" th:if="${notice}" th:text="${notice}"></p><div class="empty" th:if="${savedEntries.empty}"><h2>아직 저장한 자료가 없어요.</h2><p>관심 있는 판결이나 학습 사례에서 ‘보관함에 저장’을 눌러보세요.</p><a href="/cases">아카이브 둘러보기 →</a></div><article class="saved-card" th:each="item:${savedEntries}"><span class="badge" th:text="${item.value.demo}?'가상 학습 사례':'실제 판결'"></span><h2><a th:href="@{/cases/{id}(id=${item.value.id})}" th:text="${item.value.title}"></a></h2><p th:text="${item.value.summary}"></p><form th:action="@{/cases/{id}/note(id=${item.value.id})}" method="post"><label th:for="'note-'+${item.value.id}">나만의 메모</label><textarea th:id="'note-'+${item.value.id}" name="note" maxlength="3000" rows="4" th:text="${item.key.note}" placeholder="궁금한 쟁점이나 다시 확인할 내용을 적어보세요. 개인정보 입력은 피해주세요."></textarea><button>메모 저장</button></form><form th:action="@{/cases/{id}/unbookmark(id=${item.value.id})}" method="post"><button class="text-button danger">보관함에서 삭제</button></form></article></main><footer th:replace="~{legal/layout::footer}"></footer></body></html>
