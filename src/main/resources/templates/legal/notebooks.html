<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{legal/layout::head('나의 사건 노트')}"></head><body><header th:replace="~{legal/layout::header}"></header><main class="narrow"><div class="page-heading"><div class="eyebrow">본인만 보는 사실 정리</div><h1>나의 사건 노트</h1><p>발생한 일을 날짜순으로 정리하고 준비 자료를 확인하세요.</p><a class="button" href="/notebooks/new">새 노트 만들기</a></div><div class="empty" th:if="${notebooks.empty}"><h2>아직 작성한 노트가 없어요.</h2><p>계약·송금·통지 등 확인한 사실부터 기록해 보세요. 법률상 기한이나 결론을 자동 계산하지 않습니다.</p></div><article class="saved-card" th:each="b:${notebooks}"><span class="badge" th:text="${b.category}"></span><h2><a th:href="@{/notebooks/{id}(id=${b.id})}" th:text="${b.title}"></a></h2><p class="muted" th:text="${#temporals.format(b.createdAt,'yyyy-MM-dd')}+' 작성'"></p><a th:href="@{/notebooks/{id}(id=${b.id})}">타임라인·체크리스트 열기 →</a></article></main><footer th:replace="~{legal/layout::footer}"></footer></body></html>
