<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{legal/layout::head('자료 편집')}"></head><body><header th:replace="~{legal/layout::header}"></header><main class="narrow"><div class="page-heading"><div class="eyebrow">관리자 전용</div><h1 th:text="${editing}?'자료 편집':'새 자료 등록'"></h1><p>인정 사실·주장·해설을 구분하고 근거를 확인한 뒤 공개하세요.</p></div><form class="editor" th:action="${editing}?@{/admin/cases/{id}/edit(id=${entryId})}:@{/admin/cases/new}" th:object="${caseForm}" method="post"><input type="hidden" th:field="*{version}"><div class="notice error" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div><label for="title">쉬운 제목</label><input id="title" th:field="*{title}" maxlength="180" required><label for="summary">한눈에 보는 설명</label><input id="summary" th:field="*{summary}" maxlength="500" required><label for="tags">검색 태그·생활용어</label><input id="tags" th:field="*{tags}" maxlength="500" required><label for="category">생활 분야</label><select id="category" th:field="*{category}"><option th:each="cat:${categories}" th:value="${cat}" th:text="${cat}"></option></select><label class="check"><input type="checkbox" th:field="*{demo}">실제 판결이 아닌 가상 학습 사례</label><p class="muted">가상 사례는 실제 사건번호·법원·선고일을 저장하지 않습니다.</p><div class="field-grid"><div><label for="caseNumber">사건번호</label><input id="caseNumber" type="text" th:field="*{caseNumber}"></div><div><label for="court">법원·심급</label><input id="court" type="text" th:field="*{court}"></div><div><label for="decisionDate">선고일</label><input id="decisionDate" type="date" th:field="*{decisionDate}"></div><div><label for="outcome">결과·학습 상태</label><input id="outcome" type="text" th:field="*{outcome}"></div></div><label for="facts">인정 사실·가상 상황</label><textarea id="facts" th:field="*{facts}" maxlength="12000" rows="4"></textarea><label for="claims">당사자 주장 (인정 사실과 구분)</label><textarea id="claims" th:field="*{claims}" maxlength="12000" rows="4"></textarea><label for="issue">핵심 쟁점·질문</label><textarea id="issue" th:field="*{issue}" maxlength="12000" rows="4"></textarea><label for="reasoning">쉬운 해설</label><textarea id="reasoning" th:field="*{reasoning}" maxlength="12000" rows="4"></textarea><label for="comparison">내 상황과 비교할 조건</label><textarea id="comparison" th:field="*{comparison}" maxlength="12000" rows="4"></textarea><label for="checklist">정리할 자료 (한 줄에 한 항목)</label><textarea id="checklist" th:field="*{checklist}" maxlength="12000" rows="4"></textarea><label for="excerpt">판단의 근거가 되는 원문 발췌</label><textarea id="excerpt" th:field="*{excerpt}" maxlength="12000" rows="4"></textarea><label for="sourceUrl">공식 판결 원문 URL (HTTPS)</label><input id="sourceUrl" th:field="*{sourceUrl}" maxlength="1500"><label for="lawName">관련 법령·적용 시점 설명</label><input id="lawName" th:field="*{lawName}" maxlength="300"><label for="lawUrl">공식 법령 URL (HTTPS)</label><input id="lawUrl" th:field="*{lawUrl}" maxlength="1500"><p class="muted">법령·법원 공식 주소만 허용합니다. 본문에 실명·주소·주민등록번호 등 불필요한 개인정보를 넣지 마세요.</p><label class="check"><input type="checkbox" th:field="*{reviewed}">출처·발췌·개인정보와 실제/가상 구분을 확인했습니다.</label><label class="check"><input type="checkbox" th:field="*{published}">공개하기 (해제하면 비공개 초안)</label><p class="muted">이 확인은 법률 전문가 검수를 의미하지 않습니다. 공개 해설에는 전문가 검수 전 표시가 유지됩니다.</p><button>자료 저장</button> <a class="button secondary" href="/admin">목록</a></form><section th:if="${editing && history!=null}"><h2>변경 이력</h2><p class="muted" th:if="${history.empty}">아직 관리자 수정 이력이 없습니다.</p><details th:each="r:${history}"><summary><span th:text="${r.createdAt}"></span> · <span th:text="${r.editor}"></span></summary><pre class="pre" th:text="${r.snapshot}"></pre></details></section></main><footer th:replace="~{legal/layout::footer}"></footer></body></html>
