<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{legal/layout::head('상황별 질문 찾기')}"></head><body><header th:replace="~{legal/layout::header}"></header><main class="narrow"><div class="page-heading"><div class="eyebrow">무엇부터 확인할지 막막할 때</div><h1>세 가지 질문으로 시작해요</h1><p>선택한 상황에 맞는 쟁점과 참고 자료를 안내합니다.</p></div><form action="/situation" method="get" class="editor questionnaire"><label for="topic">1. 어떤 상황인가요?</label><select id="topic" name="topic" required><option value="">선택하세요</option><option th:each="t:${topics}" th:value="${t.key}" th:text="${t.value.label}" th:selected="${topic==t.key}"></option></select><label for="agreement">2. 계약서나 약정을 적은 문서가 있나요?</label><select id="agreement" name="agreement"><option value="unknown" th:selected="${agreement=='unknown'}">아직 확인하지 못했어요</option><option value="yes" th:selected="${agreement=='yes'}">있어요</option><option value="no" th:selected="${agreement=='no'}">없어요</option></select><label for="evidence">3. 대화·입금·통지 등 관련 기록이 있나요?</label><select id="evidence" name="evidence"><option value="unknown" th:selected="${evidence=='unknown'}">아직 확인하지 못했어요</option><option value="yes" th:selected="${evidence=='yes'}">있어요</option><option value="no" th:selected="${evidence=='no'}">없어요</option></select><button>확인할 내용 찾기</button></form><section th:if="${selection!=null}"><h2>먼저 정리해 볼 내용</h2><ul class="question-results"><li th:each="item:${questions}" th:text="${item}"></li></ul><p class="notice">선택 결과는 법적 결론이나 승소 가능성을 뜻하지 않습니다. 아래 사례와 내 상황의 차이를 함께 확인하세요.</p><a class="button secondary" href="/notebooks/new">개인 사건 노트로 정리하기 →</a><h2>연결된 참고 자료</h2><div class="empty" th:if="${matches.empty}">등록된 관련 자료가 없습니다. <a th:href="@{/law-search(q=${selection.query})}">공식 API 검색 화면 →</a></div><div class="card-grid question-cards"><th:block th:each="c:${matches}"><article th:replace="~{legal/layout::card(${c})}"></article></th:block></div></section></main><footer th:replace="~{legal/layout::footer}"></footer></body></html>
