<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{legal/layout::head('새 사건 노트')}"></head><body><header th:replace="~{legal/layout::header}"></header><main class="narrow"><div class="page-heading"><div class="eyebrow">개인 기록</div><h1>새 사건 노트</h1><p>실명·주민등록번호·주소 없이 구별하기 쉬운 제목을 적어보세요.</p></div><form class="editor" th:action="@{/notebooks}" method="post"><label for="title">노트 제목</label><input id="title" name="title" maxlength="120" placeholder="예: 이사 전 정산 기록" required><label for="category">생활 분야</label><select id="category" name="category"><option th:each="cat:${categories}" th:value="${cat}" th:selected="${sourceCase!=null && sourceCase.category==cat}" th:text="${cat}"></option></select><th:block th:if="${sourceCase!=null}"><input type="hidden" name="caseId" th:value="${sourceCase.id}"><p class="notice">참고 자료: <span th:text="${sourceCase.title}"></span><br>이 자료의 체크리스트를 복사합니다. 생활 분야는 참고 자료와 같아야 합니다.</p></th:block><p class="muted">이 노트는 내 계정에서만 표시됩니다. 입력 내용은 외부 법률 API로 전송하지 않습니다.</p><button>노트 만들기</button> <a href="/notebooks">목록으로</a></form></main><footer th:replace="~{legal/layout::footer}"></footer></body></html>
