<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{legal/layout::head('사례 비교')}"></head><body><header th:replace="~{legal/layout::header}"></header><main><div class="page-heading"><div class="eyebrow">같은 점보다 중요한 차이</div><h1>사례를 나란히 읽기</h1><p>비슷한 단어가 있어도 쟁점·증거·적용 시점은 다를 수 있어요.</p></div><form action="/compare" class="filter"><label>첫 번째 자료<select name="left" required><option value="">선택하세요</option><option th:each="c:${choices}" th:value="${c.id}" th:selected="${leftId==c.id}" th:text="(${c.demo}?'[가상] ':'[판결] ')+${c.title}"></option></select></label><label>두 번째 자료<select name="right" required><option value="">선택하세요</option><option th:each="c:${choices}" th:value="${c.id}" th:selected="${rightId==c.id}" th:text="(${c.demo}?'[가상] ':'[판결] ')+${c.title}"></option></select></label><button>비교하기</button></form><div class="empty" th:if="${leftCase==null || rightCase==null}">자료 두 개를 선택하면 쟁점과 판단을 비교할 수 있습니다.</div><div class="compare-grid" th:if="${leftCase!=null && rightCase!=null}"><article th:each="c:${ {leftCase,rightCase} }"><span class="badge" th:text="${c.demo}?'가상 학습 사례':'실제 판결'"></span><h2><a th:href="@{/cases/{id}(id=${c.id})}" th:text="${c.title}"></a></h2><p th:text="${c.caseNumber}"></p><h3>사건 배경</h3><p class="pre" th:text="${c.facts}"></p><h3>핵심 쟁점</h3><p class="pre" th:text="${c.issue}"></p><h3>판단·학습 해설</h3><p class="pre" th:text="${c.reasoning}"></p><h3>결과</h3><p th:text="${c.outcome}"></p><h3>비교할 조건</h3><p class="pre" th:text="${c.comparison}"></p><a th:if="${!c.sourceUrl.isBlank()}" th:href="${c.sourceUrl}" target="_blank" rel="noopener noreferrer">공식 원문 ↗</a></article></div></main><footer th:replace="~{legal/layout::footer}"></footer></body></html>
